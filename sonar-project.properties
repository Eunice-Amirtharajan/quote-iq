sonar.projectKey=quote-iq
sonar.organization=eunice-amirtharajan

# Production source roots only
sonar.sources=backend/src,frontend/src

# Exclude ALL test files, generated files, and scripts from source analysis
sonar.exclusions=\
  **/load-tests/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.entity.ts,\
  **/*.module.ts,\
  **/*.input.ts,\
  **/*.decorator.ts,\
  **/prisma/seed.ts,\
  **/prisma/seed-ci.ts,\
  **/prisma/seed-rag.ts,\
  **/prisma/seed-load-test.ts,\
  **/prisma/apply-trgm-indexes.ts,\
  **/prisma/explain-baseline.ts,\
  **/prisma/cleanup-e2e-data.ts,\
  **/prisma/migrations/**,\
  **/main.ts,\
  backend/src/schema.gql

# Exclude test and script files from coverage metrics
sonar.coverage.exclusions=\
  **/load-tests/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/prisma/seed.ts,\
  **/prisma/seed-ci.ts,\
  **/prisma/seed-rag.ts,\
  **/prisma/seed-load-test.ts,\
  **/prisma/apply-trgm-indexes.ts,\
  **/prisma/explain-baseline.ts,\
  **/prisma/cleanup-e2e-data.ts,\
  **/prisma/migrations/**,\
  **/main.ts

# Exclude test and generated files from duplication detection
sonar.cpd.exclusions=\
  **/load-tests/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.entity.ts,\
  **/*.module.ts

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.typescript.tsconfigPath=backend/tsconfig.json
