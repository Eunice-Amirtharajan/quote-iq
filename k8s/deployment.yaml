apiVersion: apps/v1
kind: Deployment
metadata:
  name: quoteiq-backend
  namespace: quoteiq
  labels:
    app: quoteiq-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quoteiq-backend
  template:
    metadata:
      labels:
        app: quoteiq-backend
    spec:
      containers:
        - name: backend
          image: europe-west2-docker.pkg.dev/newagent-88d6a/quoteiq/backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: quoteiq-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: quoteiq-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quoteiq-secrets
                  key: JWT_SECRET
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quoteiq-secrets
                  key: GROQ_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quoteiq-secrets
                  key: OPENAI_API_KEY
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: quoteiq-secrets
                  key: RABBITMQ_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
