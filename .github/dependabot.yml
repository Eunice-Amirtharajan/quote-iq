# Weekly dependency updates: one grouped PR per folder for minor and patch updates, and one
# grouped PR per folder for security fixes (raised as soon as an advisory is published, via
# "Dependabot security updates" in the repo settings). Major upgrades aren't proposed as version
# updates: they're planned migrations (pending item H6). Security fixes still arrive even when
# they need a major version, since the ignore rule below applies to version updates only.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /backend
      - /frontend
      - /mcp-server
    schedule:
      interval: weekly
      day: monday
    # A release must be a week old before it's proposed: freshly published versions are where
    # compromised packages show up, and most are pulled within days
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
