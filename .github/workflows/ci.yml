name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — scan every commit, not just HEAD

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Unit Tests + E2E Tests
    runs-on: ubuntu-latest
    needs: secret-scan

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: quoteiq_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quoteiq_test

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quoteiq_test

      - name: Seed test database
        working-directory: backend
        run: npx tsx src/prisma/seed-ci.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quoteiq_test

      - name: Run unit tests with coverage
        working-directory: backend
        run: npm run test:cov
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quoteiq_test
          JWT_SECRET: test-secret-key
          NODE_ENV: test
          GROQ_API_KEY: test-groq-key
          OPENAI_API_KEY: test-openai-key
          RABBITMQ_URL: amqp://guest:guest@localhost:5672

      - name: Run e2e tests
        working-directory: backend
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quoteiq_test
          JWT_SECRET: test-secret-key
          NODE_ENV: test
          PORT: 4000
          GROQ_API_KEY: test-groq-key
          OPENAI_API_KEY: test-openai-key
          CORS_ORIGIN: http://localhost:3000
          JWT_EXPIRES_IN: 7d
          RABBITMQ_URL: amqp://guest:guest@localhost:5672

      # Frontend unit tests (Vitest). Playwright covers the UI end to end, but only this run
      # produces frontend coverage for SonarCloud; without it every new frontend line counts as uncovered
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text-summary

      - name: SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  mcp-server:
    name: MCP Server (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      # Node 22.18+ runs the TypeScript tests directly (type stripping)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: quoteiq_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quoteiq_test

      - name: Run migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quoteiq_test

      - name: Seed test database
        working-directory: backend
        run: npx tsx src/prisma/seed-ci.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quoteiq_test

      - name: Build backend
        working-directory: backend
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quoteiq_test

      - name: Start backend
        working-directory: backend
        # Runs the already-built dist/main.js directly, rather than `nest
        # start` (compile + run combined) — that combo raced against its own
        # compile step when backgrounded across a step boundary, sometimes
        # starting the runtime before dist/main.js existed yet. Building as
        # its own prior step means a real build failure fails loudly here,
        # instead of surfacing later as a misleading MODULE_NOT_FOUND.
        # nohup + disown + redirected output keep the process alive after
        # this step's shell exits.
        run: nohup node dist/main.js > backend.log 2>&1 & disown
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quoteiq_test
          JWT_SECRET: test-secret-key
          NODE_ENV: development
          PORT: 4000
          GROQ_API_KEY: test-groq-key
          OPENAI_API_KEY: test-openai-key
          CORS_ORIGIN: http://localhost:5173
          JWT_EXPIRES_IN: 7d
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test-supabase-key
          MAIL_HOST: sandbox.smtp.mailtrap.io
          MAIL_PORT: 2525
          MAIL_USER: test
          MAIL_PASS: test
          MAIL_FROM: noreply@quoteiq.cc
          APP_URL: http://localhost:5173

      - name: Wait for backend
        working-directory: backend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/health && echo "Backend ready" && exit 0
            echo "Waiting for backend... attempt $i"
            sleep 3
          done
          echo "Backend never became healthy — dumping backend.log:"
          cat backend.log || echo "(no backend.log found)"
          exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/quoteiq_test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload backend log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 7
